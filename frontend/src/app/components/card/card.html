<div class="card w-full border border-base-300 bg-base-100/80 shadow-lg backdrop-blur">
    <div class="card-body gap-4">
        <div class="flex items-start justify-between gap-4">
            <div class="min-w-0 flex-1">
                <p class="text-xs uppercase tracking-[0.3em] text-base-content/50">Observed channel</p>
                <h2 class="mt-2 break-words text-2xl font-semibold leading-tight">{{ channelName() }}</h2>
            </div>

            <span class="badge badge-outline badge-primary min-w-28 justify-center whitespace-nowrap px-4">{{ status() }}</span>
        </div> 

        <p class="text-sm text-base-content/70">
            This channel is shown in the monitoring list and can be managed from this view.
        </p>

        <div class="card-actions justify-between">
            <button
                class="btn btn-error btn-outline btn-sm btn-square"
                type="button"
                [disabled]="deleting()"
                (click)="deleteRequested.emit()"
                aria-label="Delete channel"
                title="Delete channel from database"
            >
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="size-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673A2.25 2.25 0 0 1 15.916 21H8.084a2.25 2.25 0 0 1-2.244-1.327L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0V4.875c0-1.125-.84-2.062-1.965-2.142a51.964 51.964 0 0 0-3.57 0C8.84 2.813 8 3.75 8 4.875V5.25m7.5 0h-7.5" />
                </svg>
            </button>

            <a class="btn btn-primary btn-sm" [routerLink]="channelId() ? ['/channels', channelId()] : null">Open</a>
        </div>
    </div>
</div>
